name: Native iOS
on:
  push:
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
concurrency:
  group: native-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Financial core tests
        run: swift test --package-path native
      - name: Build native iOS app for simulator
        run: xcodebuild -project native/Stack.xcodeproj -scheme Stack -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/StackDerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Launch app in iPhone simulator
        run: bash ci/native-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-overview
          path: /tmp/StackScreenshots/overview.png
